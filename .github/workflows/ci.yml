name: CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  # release.yml calls this workflow so a tag cannot ship without the same
  # audit, version matrix, lint, typecheck and bundle checks as master.
  workflow_call:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Audit locked Python runtime
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false

    - name: Set up audit Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"

    - name: Install reviewed audit tool
      # This exact version produced the 2026-07-20 remediation baseline.
      run: python -m pip install --disable-pip-version-check pip-audit==2.9.0

    - name: Reject vulnerable locked runtime dependencies
      run: >-
        python -m pip_audit
        --requirement vscode-extension/scripts/requirements-bundle.lock
        --disable-pip --strict --progress-spinner off

  test:
    name: Run Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run pytest
      run: python -m pytest -v --tb=short

    - name: Measure Python coverage
      # Coverage tracing makes SQLite timing assertions measure the tracer
      # instead of production performance; the uninstrumented step above remains
      # the authoritative full-suite performance gate for all four checks.
      run: >-
        python -m pytest -q
        --deselect=tests/test_sqlite_integration.py::TestCommentParser::test_p3_performance_sqlite3_c
        --deselect=tests/test_sqlite_integration.py::TestCommentParser::test_p3_performance_shell_c
        --deselect=tests/test_sqlite_integration.py::TestDiffEngine::test_d3_performance_sqlite3_c
        --deselect=tests/test_sqlite_integration.py::TestFingerprint::test_f4_fingerprint_performance_sqlite3_c
        --cov=diffinite --cov-report=term-missing

    - name: Python lint (changed correctness boundaries)
      run: >-
        python -m ruff check
        src/diffinite/calibration.py
        src/diffinite/cli.py
        src/diffinite/collector.py
        src/diffinite/deep_compare.py
        src/diffinite/evidence.py
        src/diffinite/models.py
        src/diffinite/parser.py
        src/diffinite/pdf_gen.py
        src/diffinite/pipeline.py
        tests/test_benchmark_smoke.py
        tests/test_bundle_metadata.py
        tests/test_calibration.py
        tests/test_cli_validation.py
        tests/test_csv_security.py
        tests/test_deep_compare.py
        tests/test_evidence_hash.py
        tests/test_json_report_integration.py
        tests/test_operational_boundaries.py
        tests/test_p0_regressions.py
        tests/test_parser.py
        tests/test_pdf_gen.py
        tests/test_pipeline.py
        tests/test_release_security.py
        tests/test_remaining_threats.py
        tests/test_audit_regressions_report_truth.py
        tests/test_download_examples.py
        tests/test_report_preset_invariance.py
        tests/test_audit2_tooling.py
        tests/test_input_policy.py
        example/benchmark/run_benchmarks.py
        example/download_examples.py

    - name: Python format check (new correctness boundaries)
      run: >-
        python -m ruff format --check
        src/diffinite/calibration.py
        src/diffinite/deep_compare.py
        src/diffinite/evidence.py
        tests/test_benchmark_smoke.py
        tests/test_bundle_metadata.py
        tests/test_csv_security.py
        tests/test_deep_compare.py
        tests/test_evidence_hash.py
        tests/test_operational_boundaries.py
        tests/test_p0_regressions.py
        tests/test_release_security.py
        tests/test_remaining_threats.py
        tests/test_audit_regressions_report_truth.py
        tests/test_download_examples.py
        tests/test_report_preset_invariance.py
        tests/test_input_policy.py
        example/benchmark/run_benchmarks.py

    - name: Python typecheck
      run: python -m mypy

  test-vscode-bundle:
    name: Test VSCode Bundle (CD)
    runs-on: windows-latest
    needs: test
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        # package-lock.json contains publishing-tool dependencies requiring Node 22.
        node-version: "22"

    - name: Install Extension dependencies
      working-directory: vscode-extension
      run: npm ci

    - name: Typecheck and test TypeScript logic
      working-directory: vscode-extension
      run: npm test

    - name: Test Bundle Generation & Smoke Test
      shell: pwsh
      run: |
        # The bundled Python version and its hash pin live only in the script.
        ./vscode-extension/scripts/build_bundle.ps1

    - name: Test VSIX Packaging
      working-directory: vscode-extension
      shell: pwsh
      run: |
        npx --no-install vsce package --target win32-x64 --no-dependencies --allow-star-activation --out test-bundle.vsix
        Remove-Item test-bundle.vsix -ErrorAction SilentlyContinue
